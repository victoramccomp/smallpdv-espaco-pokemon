<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b8a91">
  <title>Entrar · PDV</title>
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">
  <main class="conteudo">
    <div class="marca-login">
      <img src="img/icone.svg" alt="" width="64" height="64">
      <h1>PDV</h1>
      <p>Entre com o e-mail e a senha que o admin cadastrou.</p>
    </div>

    <form id="form-login" class="cartao" novalidate>
      <label class="campo">
        <span>E-mail</span>
        <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <input id="senha" type="password" autocomplete="current-password" required>
      </label>
      <button class="botao" type="submit" id="btn-entrar">Entrar</button>
    </form>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
